name: Build plugin archive
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nakama-agones-plugin
          path: dist/*.tar.gz
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: ./scripts/package-console.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nakama-agones-console
          path: dist/nakama-agones-console-*.tar.gz
