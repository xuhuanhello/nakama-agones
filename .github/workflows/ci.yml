name: Validate Agones integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: make test test-race
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check internal/console/web/app.js
      - run: pip install PyYAML==6.0.2
      - run: python3 deploy/observability/validate.py
      - run: python3 -m py_compile scripts/local_cluster.py scripts/k3s_node.py scripts/issue_nakama_token.py examples/room-worker/server.py
      - run: python3 -m unittest discover -s tests
      - name: Validate optional regional controller image
        run: |
          docker build --platform linux/amd64 -f deploy/enrollment/Dockerfile \
            --build-arg "PYTHON_IMAGE=$(cat deploy/enrollment/base-image.txt)" \
            --build-arg "VCS_REF=$GITHUB_SHA" -t node-enrollment:ci .
          test "$(docker image inspect node-enrollment:ci --format '{{.Config.User}}')" = '10001:10001'
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges node-enrollment:ci --help
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./scripts/bootstrap-tools.sh
      - run: python3 scripts/local_cluster.py up
      - run: node scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safe-integration-result
          path: .local/smoke-result.json
          if-no-files-found: ignore
      - if: always()
        run: |
          if [ -x .local/tools/k3d ]; then python3 scripts/local_cluster.py reset; fi
