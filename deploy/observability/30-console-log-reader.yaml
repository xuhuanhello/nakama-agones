apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-console-loki-read
  namespace: agones-observability
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ["http:fleet-loki:http"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-console-loki-read
  namespace: agones-observability
subjects:
  - kind: ServiceAccount
    name: fleet-console
    namespace: agones-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-console-loki-read
