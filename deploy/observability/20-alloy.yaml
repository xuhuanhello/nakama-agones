apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-alloy
  namespace: agones-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-alloy-pod-logs
  namespace: agones-games
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-alloy-pod-logs
  namespace: agones-games
subjects:
  - kind: ServiceAccount
    name: fleet-alloy
    namespace: agones-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-alloy-pod-logs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-alloy-pod-logs
  namespace: agones-system
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-alloy-pod-logs
  namespace: agones-system
subjects:
  - kind: ServiceAccount
    name: fleet-alloy
    namespace: agones-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-alloy-pod-logs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fleet-alloy-positions
  namespace: agones-observability
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-alloy-config
  namespace: agones-observability
data:
  config.alloy: |
    logging {
      level  = "warn"
      format = "logfmt"
    }

    discovery.kubernetes "games" {
      role = "pod"
      namespaces {
        names = ["agones-games"]
      }
      selectors {
        role  = "pod"
        label = "app.kubernetes.io/managed-by=nakama-agones"
      }
    }

    discovery.kubernetes "system" {
      role = "pod"
      namespaces {
        names = ["agones-system"]
      }
      selectors {
        role  = "pod"
        label = "app=agones,agones.dev/role in (controller,extensions)"
      }
    }

    discovery.relabel "games" {
      targets = discovery.kubernetes.games.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        regex         = "game|agones-gameserver-sidecar"
        action        = "keep"
      }
    }

    discovery.relabel "system" {
      targets = discovery.kubernetes.system.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        regex         = "agones-controller|agones-extensions"
        action        = "keep"
      }
    }

    discovery.relabel "labels" {
      targets = array.concat(discovery.relabel.games.output, discovery.relabel.system.output)
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        target_label = "cluster"
        replacement  = sys.env("FLEET_LOG_CLUSTER")
      }
      rule {
        action = "labelkeep"
        regex  = "cluster|namespace|pod|container|__meta_kubernetes_namespace|__meta_kubernetes_pod_name|__meta_kubernetes_pod_uid|__meta_kubernetes_pod_container_name"
      }
    }

    loki.source.kubernetes "fleet" {
      targets    = discovery.relabel.labels.output
      forward_to = [loki.process.sanitize.receiver]
    }

    loki.process "sanitize" {
      forward_to = [loki.write.local.receiver]

      stage.decolorize {}
      // Drop the whole suspicious line, including escaped JSON and DSNs.
      // Never turn arbitrary fields from a game message into Loki labels.
      stage.drop {
        expression = `(?i)(token|password|passwd|secret|credential|authorization|key|dsn|connection[_ -]?string)[[:space:]"'\\]*[:=]`
        drop_counter_reason = "sensitive_field"
      }
      stage.drop {
        expression = `(?i)(bearer|basic)[[:space:]]+[A-Za-z0-9._~+/=-]+|[a-z][a-z0-9+.-]*://[^[:space:]/]+:[^[:space:]@]+@`
        drop_counter_reason = "credential_or_dsn"
      }
      stage.drop {
        expression = `[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|(?i)\bpf(client)?_[A-Za-z0-9_-]{16,}`
        drop_counter_reason = "credential_value"
      }
      stage.drop {
        expression = `(?i)-----[A-Z ]*PRIVATE KEY-----|^[[:space:]]*[A-Za-z0-9+/]{48,}={0,2}[[:space:]]*$`
        drop_counter_reason = "private_key_material"
      }
      stage.drop {
        longer_than = "16KB"
        drop_counter_reason = "oversized_line"
      }
      stage.label_keep {
        values = ["cluster", "namespace", "pod", "container"]
      }
    }

    loki.write "local" {
      max_streams = 256
      endpoint {
        url                 = "http://fleet-loki.agones-observability.svc.cluster.local:3100/loki/api/v1/push"
        batch_wait          = "1s"
        batch_size          = "256KiB"
        remote_timeout      = "10s"
        min_backoff_period  = "500ms"
        max_backoff_period  = "30s"
        max_backoff_retries = 20
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-alloy
  namespace: agones-observability
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # No overlapping collectors or concurrent positions writers during rollouts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-alloy
        app.kubernetes.io/part-of: nakama-agones
    spec:
      serviceAccountName: fleet-alloy
      nodeSelector:
        kubernetes.io/os: linux
        nakama-agones.io/role: control
      tolerations:
        - key: CriticalAddonsOnly
          operator: Equal
          value: "true"
          effect: NoExecute
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy
            - --disable-reporting
            - /etc/alloy/config.alloy
          env:
            - name: FLEET_LOG_CLUSTER
              value: nakama-agones
            - name: GOMEMLIMIT
              value: 200MiB
            - name: GOMAXPROCS
              value: "1"
          ports:
            - name: health
              containerPort: 12345
          resources:
            requests: {cpu: 50m, memory: 128Mi, ephemeral-storage: 32Mi}
            limits: {cpu: 250m, memory: 256Mi, ephemeral-storage: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: {path: /-/ready, port: health}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /-/ready, port: health}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /-/healthy, port: health}
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - {name: config, mountPath: /etc/alloy, readOnly: true}
            - {name: positions, mountPath: /var/lib/alloy}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: fleet-alloy-config
        - name: positions
          persistentVolumeClaim:
            claimName: fleet-alloy-positions
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
