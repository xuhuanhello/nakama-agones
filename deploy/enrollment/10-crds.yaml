                      },
                      "stage": {
                        "type": "string",
                        "maxLength": 96,
                        "pattern": "^[a-z0-9_]*$"
                      },
                      "error": {
                        "type": "string",
                        "maxLength": 96,
                        "pattern": "^[a-z0-9_]*$"
                      },
                      "created_at": {
                        "type": "integer",
                        "format": "int64",
                        "minimum": 0
                      },
                      "updated_at": {
                        "type": "integer",
                        "format": "int64",
                        "minimum": 0
                      },
                      "checks": {
                        "type": "array",
                        "maxItems": 32,
                        "items": {
                          "type": "object",
                          "required": [
                            "name",
                            "ok",
