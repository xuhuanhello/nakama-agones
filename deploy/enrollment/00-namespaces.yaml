{
  "apiVersion": "v1",
  "kind": "Namespace",
  "metadata": {
    "name": "fleet-enrollment-requests",
    "labels": {
      "pod-security.kubernetes.io/enforce": "restricted",
      "pod-security.kubernetes.io/enforce-version": "v1.35"
    }
  }
}

---
{
  "apiVersion": "v1",
  "kind": "Namespace",
  "metadata": {
    "name": "fleet-enrollment-system",
    "labels": {
      "pod-security.kubernetes.io/enforce": "restricted",
      "pod-security.kubernetes.io/enforce-version": "v1.35"
    }
  }
}

---
{
  "apiVersion": "v1",
  "kind": "ResourceQuota",
  "metadata": {
    "name": "enrollment-bounds",
    "namespace": "fleet-enrollment-requests"
  },
  "spec": {
    "hard": {
      "count/nodeenrollments.infrastructure.nakama-agones.io": "100",
      "count/noderetirements.infrastructure.nakama-agones.io": "100",
      "secrets": "20",
      "pods": "0",
      "services": "0"
    }
  }
}
