{
  "apiVersion": "admissionregistration.k8s.io/v1",
  "kind": "ValidatingAdmissionPolicy",
  "metadata": {
    "name": "fleet-enrollment-secret-shape"
  },
  "spec": {
    "failurePolicy": "Fail",
    "matchConstraints": {
      "resourceRules": [
        {
          "apiGroups": [
            ""
          ],
          "apiVersions": [
            "v1"
          ],
          "operations": [
            "CREATE"
          ],
          "resources": [
            "secrets"
          ]
        }
      ]
    },
    "matchConditions": [
      {
        "name": "submitter-only",
        "expression": "request.userInfo.username == 'system:serviceaccount:fleet-enrollment-system:fleet-enrollment-submitter'"
      }
    ],
    "validations": [
      {
        "expression": "request.namespace == 'fleet-enrollment-requests' && object.metadata.name.matches('^ssh-[a-f0-9]{32}$')",
        "message": "only request credentials may be created"
      },
      {
        "expression": "object.type == 'Opaque' && has(object.immutable) && object.immutable && has(object.data) && object.data.size() == 1 && 'password' in object.data && size(object.data['password']) <= 1368",
        "message": "one immutable bounded password is required"
      },
      {
        "expression": "has(object.metadata.labels) && 'nakama-agones.io/enrollment-id' in object.metadata.labels && object.metadata.name == 'ssh-' + object.metadata.labels['nakama-agones.io/enrollment-id']",
        "message": "credential label must match its name"
      },
      {
        "expression": "has(object.metadata.ownerReferences) && object.metadata.ownerReferences.size() == 1 && object.metadata.ownerReferences.all(o, o.apiVersion == 'infrastructure.nakama-agones.io/v1alpha1' && o.kind == 'NodeEnrollment' && o.name == 'enroll-' + object.metadata.labels['nakama-agones.io/enrollment-id'] && size(o.uid) > 0 && (!has(o.controller) || !o.controller) && (!has(o.blockOwnerDeletion) || !o.blockOwnerDeletion))",
        "message": "credential must be owned by one enrollment request"
      }
    ]
  }
}

---
{
  "apiVersion": "admissionregistration.k8s.io/v1",
  "kind": "ValidatingAdmissionPolicyBinding",
  "metadata": {
    "name": "fleet-enrollment-secret-shape"
  },
  "spec": {
    "policyName": "fleet-enrollment-secret-shape",
    "validationActions": [
      "Deny"
    ]
  }
}
