apiVersion: v1
kind: Namespace
metadata:
  name: agones-control
---
apiVersion: v1
kind: Namespace
metadata:
  name: agones-games
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nakama-agones
  namespace: agones-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nakama-agones
  namespace: agones-games
rules:
  - apiGroups: [agones.dev]
    resources: [gameservers]
    verbs: [get, list, create, delete]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nakama-agones
  namespace: agones-games
subjects:
  - kind: ServiceAccount
    name: nakama-agones
    namespace: agones-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nakama-agones
